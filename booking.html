<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment | Softouch Barbershop Mthatha</title>
  <meta name="description" content="Book your haircut or gaming session at Softouch Barbershop, Nelson Mandela Drive, Mthatha.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header" id="header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Softouch Barbershop logo">
      </a>
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gaming.html">Gaming</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html" class="btn btn-small">Book Now</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="eyebrow">Reserve Your Spot</p>
        <h1>Book an Appointment</h1>
      </div>
    </section>

    <section class="section">
      <div class="container booking-wrap">
        <form class="form" id="bookingForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="name">Full Name</label>
              <input type="text" id="name" placeholder="John Smith">
              <small class="error" id="nameError"></small>
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="067 123 4567">
              <small class="error" id="phoneError"></small>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="service">Service</label>
              <select id="service">
                <option value="">Choose a service</option>
                <option>Classic Haircut</option>
                <option>Fade &amp; Design</option>
                <option>Beard Trim</option>
                <option>Hot Towel Shave</option>
                <option>Kids Cut</option>
                <option>Cut &amp; Beard Combo</option>
                <!-- New option for the gaming service -->
                <option>PlayStation Gaming</option>
              </select>
              <small class="error" id="serviceError"></small>
            </div>
            <div class="field">
              <label for="date">Preferred Date</label>
              <input type="date" id="date">
              <small class="error" id="dateError"></small>
            </div>
          </div>
          <button type="submit" class="btn">Request Booking</button>
          <p class="form-success" id="formSuccess"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Softouch Barbershop. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
