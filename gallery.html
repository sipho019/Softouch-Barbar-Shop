<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Softouch Barbershop Mthatha</title>
  <meta name="description" content="See our haircuts, fades and tapers at Softouch Barbershop, Mthatha.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header" id="header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Softouch Barbershop logo">
      </a>
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gaming.html">Gaming</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html" class="btn btn-small">Book Now</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="eyebrow">Our Work</p>
        <h1>Gallery</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery">
          <!-- Each photo is a <figure>: an image plus a <figcaption> (the label on top of it).
               loading="lazy" makes the browser load photos only as you scroll to them,
               which keeps the page fast with this many images.
               The captions are guessed from your file names, so edit them to match. -->
          <figure>
            <img src="images/taperfade.jpg" alt="Taper fade haircut" loading="lazy">
            <figcaption>Taper Fade</figcaption>
          </figure>
          <figure>
            <img src="images/tapefade.jpg" alt="Taper fade haircut" loading="lazy">
            <figcaption>Taper Fade</figcaption>
          </figure>
          <figure>
            <img src="images/tapercut.jpg" alt="Taper cut" loading="lazy">
            <figcaption>Taper Cut</figcaption>
          </figure>
          <figure>
            <img src="images/brushcut.jpg" alt="Brush cut" loading="lazy">
            <figcaption>Brush Cut</figcaption>
          </figure>
          <figure>
            <img src="images/brush.jpg" alt="Brush style haircut" loading="lazy">
            <figcaption>Brush Style</figcaption>
          </figure>
          <figure>
            <img src="images/blond.jpg" alt="Blond haircut" loading="lazy">
            <figcaption>Blond Cut</figcaption>
          </figure>
          <figure>
            <img src="images/tintcut.jpg" alt="Tint cut" loading="lazy">
            <figcaption>Tint Cut</figcaption>
          </figure>
          <figure>
            <img src="images/clothfade.jpg" alt="Fade haircut" loading="lazy">
            <figcaption>Fade</figcaption>
          </figure>
          <figure>
            <img src="images/clothingfade.jpg" alt="Fade haircut" loading="lazy">
            <figcaption>Fade</figcaption>
          </figure>
          <figure>
            <img src="images/smilef.jpg" alt="Fresh fade haircut" loading="lazy">
            <figcaption>Fresh Fade</figcaption>
          </figure>
          <figure>
            <img src="images/childfade.jpg" alt="Kids fade haircut" loading="lazy">
            <figcaption>Kids Fade</figcaption>
          </figure>
          <figure>
            <img src="images/sonfade.jpg" alt="Kids fade haircut" loading="lazy">
            <figcaption>Kids Fade</figcaption>
          </figure>
          <figure>
            <img src="images/clean.jpg" alt="Clean haircut" loading="lazy">
            <figcaption>Clean Cut</figcaption>
          </figure>
          <figure>
            <img src="images/cut.jpg" alt="Fresh haircut" loading="lazy">
            <figcaption>Fresh Cut</figcaption>
          </figure>
          <figure>
            <img src="images/riz.jpg" alt="Fresh haircut" loading="lazy">
            <figcaption>Fresh Cut</figcaption>
          </figure>
          <figure>
            <img src="images/client.jpg" alt="Happy client" loading="lazy">
            <figcaption>Happy Client</figcaption>
          </figure>
          <figure>
            <img src="images/clientimage.jpg" alt="Happy client" loading="lazy">
            <figcaption>Happy Client</figcaption>
          </figure>
          <figure>
            <img src="images/employe.jpg" alt="Softouch barber" loading="lazy">
            <figcaption>Our Barber</figcaption>
          </figure>
        </div>
        <p class="center-btn"><a href="booking.html" class="btn">Book Your Cut</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Softouch Barbershop. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
